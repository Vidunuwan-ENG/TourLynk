version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tourlynk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tourlynk_db
      MYSQL_USER: tourlynk
      MYSQL_PASSWORD: tourlynk_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tourlynk", "-ptourlynk_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourlynk-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tourlynk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
      SPRING_DATASOURCE_USERNAME: tourlynk
      SPRING_DATASOURCE_PASSWORD: tourlynk_pass
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourlynk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  mysql_data:
    driver: local

